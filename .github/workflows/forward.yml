name: forward
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: forward
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python forward.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT: ${{ secrets.BALE_CHAT }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT: ${{ secrets.RUBIKA_CHAT }}
      - name: commit map and trigger bale-forward
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "forward-bot"
          git config user.email "bot@users.noreply.github.com"
          git add map.json
          if ! git diff --cached --quiet; then
            git commit -m "update map"
            git push
            curl -s -o /dev/null -w "dispatch: %{http_code}\n" -X POST \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/veymacollection/bale-forward/actions/workflows/forward.yml/dispatches \
              -d '{"ref":"main"}'
          fi
