name: forward
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency: forward
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python forward.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT: ${{ secrets.BALE_CHAT }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT: ${{ secrets.RUBIKA_CHAT }}
